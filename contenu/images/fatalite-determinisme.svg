<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="300" rx="14" fill="#fffdf7"/>
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#3b2470">Déterminisme ou fatalisme ?</text>
<text x="160" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#164ba6">Déterminisme</text>
<g fill="#e6f0ff" stroke="#1f63d6" stroke-width="3"><circle cx="40" cy="130" r="20"/><circle cx="110" cy="100" r="20"/><circle cx="110" cy="170" r="20"/><circle cx="190" cy="130" r="20"/><circle cx="270" cy="130" r="20"/></g>
<g stroke="#1f63d6" stroke-width="3"><path d="M58 122L92 106"/><path d="M58 138L92 164"/><path d="M128 106L172 124"/><path d="M128 164L172 136"/><path d="M210 130L250 130"/></g>
<text x="160" y="222" text-anchor="middle" font-size="14" fill="#164ba6">Chaque événement a des causes.</text><text x="160" y="242" text-anchor="middle" font-size="14" fill="#164ba6">Mes actes font partie des causes.</text>
<line x1="320" y1="50" x2="320" y2="270" stroke="#c9c2b4" stroke-width="2" stroke-dasharray="6 6"/>
<text x="480" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#b83232">Fatalisme</text>
<g fill="#fdeaea" stroke="#b83232" stroke-width="3"><circle cx="370" cy="100" r="18"/><circle cx="370" cy="150" r="18"/><circle cx="370" cy="200" r="18"/></g>
<g stroke="#b83232" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#b)"><path d="M390 100L560 150"/><path d="M390 150L560 150"/><path d="M390 200L560 150"/></g>
<rect x="562" y="128" width="58" height="44" rx="8" fill="#b83232"/><text x="591" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">FIN</text>
<text x="480" y="242" text-anchor="middle" font-size="14" fill="#b83232">Quoi que je fasse, ça arrivera.</text><text x="480" y="262" text-anchor="middle" font-size="14" fill="#b83232">Mes actes ne changent rien.</text>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#b83232"/></marker></defs></svg>
