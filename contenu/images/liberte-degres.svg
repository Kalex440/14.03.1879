<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="280" rx="14" fill="#fffdf7"/>
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#3b2470">Trois degrés de liberté</text>
<g><rect x="30" y="170" width="170" height="80" rx="10" fill="#f1efe8" stroke="#7a6f5a" stroke-width="3"/><text x="115" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#4a4233">1. Indifférence</text><text x="115" y="220" text-anchor="middle" font-size="13" fill="#4a4233">choisir au hasard,</text><text x="115" y="238" text-anchor="middle" font-size="13" fill="#4a4233">sans raison</text>
<rect x="235" y="115" width="170" height="135" rx="10" fill="#e6f0ff" stroke="#1f63d6" stroke-width="3"/><text x="320" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#164ba6">2. Choix éclairé</text><text x="320" y="167" text-anchor="middle" font-size="13" fill="#164ba6">choisir en connaissant</text><text x="320" y="185" text-anchor="middle" font-size="13" fill="#164ba6">les raisons (Descartes)</text>
<rect x="440" y="60" width="170" height="190" rx="10" fill="#efe8fb" stroke="#6d3fc0" stroke-width="3"/><text x="525" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2470">3. Autonomie</text><text x="525" y="112" text-anchor="middle" font-size="13" fill="#3b2470">obéir à la loi</text><text x="525" y="130" text-anchor="middle" font-size="13" fill="#3b2470">que je me donne</text><text x="525" y="148" text-anchor="middle" font-size="13" fill="#3b2470">(Rousseau, Kant)</text></g>
<path d="M205 210 L230 190" stroke="#23793a" stroke-width="4" marker-end="url(#a)"/><path d="M410 170 L435 140" stroke="#23793a" stroke-width="4" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#23793a"/></marker></defs></svg>
