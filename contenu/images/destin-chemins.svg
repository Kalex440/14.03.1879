<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="300" rx="14" fill="#fffdf7"/>
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#3b2470">Trois manières de vivre son destin</text>
<g stroke-width="5" fill="none" stroke-linecap="round"><path d="M40 170 C150 170 200 80 330 80 S520 80 600 80" stroke="#6d3fc0"/><path d="M40 170 C170 170 230 170 330 170 S520 170 600 170" stroke="#7a6f5a" stroke-dasharray="2 10"/><path d="M40 170 C150 170 200 260 330 260 S520 260 600 260" stroke="#b83232"/></g>
<circle cx="40" cy="170" r="12" fill="#ffc634" stroke="#b8860b" stroke-width="3"/><text x="40" y="205" text-anchor="middle" font-size="13" fill="#3b352a">ma naissance</text>
<text x="600" y="62" text-anchor="end" font-size="15" font-weight="700" fill="#3b2470">Je le construis (Sartre)</text>
<text x="600" y="152" text-anchor="end" font-size="15" font-weight="700" fill="#4a4233">Je l'accepte (stoïciens, amor fati)</text>
<text x="600" y="290" text-anchor="end" font-size="15" font-weight="700" fill="#b83232">Je le subis ou je lutte en vain (Œdipe)</text></svg>
