<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="300" rx="14" fill="#fffdf7"/>
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#3b2470">Le hasard selon Cournot : deux séries qui se croisent</text>
<path d="M40 260 L320 150" stroke="#1f63d6" stroke-width="5" marker-end="url(#c)"/><path d="M600 260 L320 150" stroke="#b54708" stroke-width="5" marker-end="url(#d)"/>
<circle cx="320" cy="150" r="20" fill="#ffc634" stroke="#b8860b" stroke-width="3"/><text x="320" y="156" text-anchor="middle" font-size="18" font-weight="700" fill="#3b2470">?!</text>
<text x="40" y="60" font-size="14" fill="#164ba6" font-weight="700">Série 1 : tu vas au marché</text><text x="40" y="80" font-size="13" fill="#164ba6">(tes raisons à toi)</text>
<text x="600" y="60" text-anchor="end" font-size="14" fill="#b54708" font-weight="700">Série 2 : ton débiteur y va aussi</text><text x="600" y="80" text-anchor="end" font-size="13" fill="#b54708">(ses raisons à lui)</text>
<text x="320" y="200" text-anchor="middle" font-size="15" fill="#3b2470" font-weight="700">Chaque série est causée, mais indépendante de l'autre.</text><text x="320" y="224" text-anchor="middle" font-size="15" fill="#3b2470" font-weight="700">Leur rencontre n'a pas été prévue : c'est le hasard.</text>
<defs><marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1f63d6"/></marker><marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#b54708"/></marker></defs></svg>
